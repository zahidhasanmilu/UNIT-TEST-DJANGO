<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <title>
    {% block title %}
    {% endblock title %}
        </title>

    <style>
        .full-screen-center {
            /* Viewport height 100% */
            min-height: 100vh; 
            /* Flex utilities for centering */
            display: flex;
            align-items: center; /* Vertical centering */
            justify-content: center; /* Horizontal centering */
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">primary</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarID"
                aria-controls="navbarID" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarID">
                <div class="navbar-nav">
                    <a class="nav-link active" aria-current="page" href="{% url 'index' %}">Home</a>
                    
                </div>
            </div>
        </div>
    </nav>
   <div class="container">
     <h1>WebSocket Test, Count: </h1>
    <h3 id="ct"></h3>
   </div>
    
    {% block content %}
        
    {% endblock content %}
        
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
        ws = new WebSocket("ws://localhost:8000/ws/ac/");
        ws.onopen = function() {
            console.log("WebSocket connection opened");
            ws.send("Hello, Server!, Im Client");
        };
        ws.onmessage = function(event) {
            console.log("Message from server:", event);
            console.log(typeof(event.data))

            var data = JSON.parse(event.data);
            console.log(typeof(data))
            document.getElementById('ct').textContent = data.count;
        };
        ws.onerror = function(event) {
            console.error("WebSocket error:", event);
        };
        ws.onclose = function(event) {
            console.log("WebSocket connection closed", event);
        };
    </script>
</body>
</html>
