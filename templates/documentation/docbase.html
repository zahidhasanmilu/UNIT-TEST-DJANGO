<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Colorful 3-Column Documentation Template</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">

    <style>
        /* কাস্টম CSS: সাইডবার এবং মেটাডেটা কলামকে স্ক্রোল করার জন্য এবং স্থির রাখার জন্য */
        .sticky-section {
            height: calc(100vh - 56px);
            /* 100% viewport height minus navbar height */
            overflow-y: auto;
            position: sticky;
            top: 56px;
            /* নেভিগেশন বারের নিচে স্থির থাকবে */
            padding-top: 15px;
        }

        .main-content {
            padding: 30px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark bg-primary shadow sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{% url 'index' %}"><i class="bi bi-book me-2"></i>Home</a>
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-book me-2"></i> Documentation Hub</a>
            <span class="navbar-text text-light">
                {% if user.is_authenticated %}
                {{ user.username }}
                {% endif %}
            </span>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <div class="col-md-3 col-lg-2 bg-light sticky-section d-none d-md-block border-end">
                <h5 class="mt-2 mb-3 text-primary"><i class="bi bi-list-task"></i> Topics</h5>
                <ul class="nav flex-column ps-2">

                    {% for documentation in all_documentations %}
                    <li class="nav-item mb-1">
                        <a class="nav-link {% if documentation.id == selected_id %}active bg-primary text-white rounded shadow-sm{% endif %}"
                            aria-current="page" href="{% url 'documentation_detail' documentation.pk %}">
                            {{ documentation.title }}
                        </a>
                    </li>
                    {% endfor %}


                </ul>
            </div>

            {% block content %}

            {% endblock content %}


        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>

</body>

</html>
