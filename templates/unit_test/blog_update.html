{% extends 'base/base.html' %}


{% block title %}
    Update {{blog.title}}
{% endblock title %}


{% block content %}
<div class="container my-5">
    <h2 class="mb-4">Update Blog: {{ blog.title }}</h2>
    <form action="{% url 'blog_update' blog.slug %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>

</div>
{% endblock content %}
